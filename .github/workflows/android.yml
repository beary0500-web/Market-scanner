
name: Build Market Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2.1-dev
    paths:
      - 'Market_Scanner_v2.1_GitHub_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v2.1 source package
        shell: bash
        run: |
          test -f Market_Scanner_v2.1_GitHub_Source.zip
          mkdir -p /tmp/market-scanner-source
          unzip -q Market_Scanner_v2.1_GitHub_Source.zip -d /tmp/market-scanner-source
          test -f /tmp/market-scanner-source/settings.gradle
          test -f /tmp/market-scanner-source/app/build.gradle
          cp -a /tmp/market-scanner-source/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project configuration
        run: |
          grep -q "versionName '2.1-dev'" app/build.gradle
          grep -q "jvmTarget = '17'" app/build.gradle

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: market-scanner-v2.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
