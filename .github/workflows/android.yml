
name: Build Market Scanner v3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2.1-dev
      - v3.0-dev
      - main
    paths:
      - 'Market_Scanner_v3.0_GitHub_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e
          test -f Market_Scanner_v3.0_GitHub_Source.zip
          echo "v3.0 source ZIP found"

      - name: Extract v3.0 source
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/market-scanner-v3
          unzip -q Market_Scanner_v3.0_GitHub_Source.zip \
            -d /tmp/market-scanner-v3

          test -f /tmp/market-scanner-v3/settings.gradle
          test -f /tmp/market-scanner-v3/app/build.gradle
          test -f /tmp/market-scanner-v3/app/src/main/assets/index.html

          cp -a /tmp/market-scanner-v3/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Verify v3.0 project
        shell: bash
        run: |
          set -e
          grep -q "versionName '3.0-dev'" app/build.gradle
          grep -q "jvmTarget = '17'" app/build.gradle
          grep -q 'Market Scanner v3.0' \
            app/src/main/assets/index.html

          echo "v3.0 project verification passed"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-scanner-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
