
name: Build Market Scanner v3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2.1-dev
      - v3.0-dev
      - main
    paths:
      - 'Market_Scanner_v3.0_GitHub_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v3.0 project
        shell: bash
        run: |
          test -f Market_Scanner_v3.0_GitHub_Source.zip
          mkdir -p /tmp/market-scanner-v3
          unzip -q Market_Scanner_v3.0_GitHub_Source.zip -d /tmp/market-scanner-v3
          test -f /tmp/market-scanner-v3/settings.gradle
          test -f /tmp/market-scanner-v3/app/build.gradle
          test -f /tmp/market-scanner-v3/app/src/main/assets/index.html
          cp -a /tmp/market-scanner-v3/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verify v3.0 project
        shell: bash
        run: |
          grep -q "versionName '3.0-dev'" app/build.gradle
          grep -q "jvmTarget = '17'" app/build.gradle
          grep -q 'Market Scanner v3.0' app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: market-scanner-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
